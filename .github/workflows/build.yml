name: PlatformIO CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PIO_ENV: ${{ matrix.env }}
      BIN_EXT: ${{ matrix.bin_ext }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: glyph_mk6
            bin_ext: uf2
    steps:
    - name: Check out source code
      uses: actions/checkout@v4

    - name: short sha
      run: echo "SHA_SHORT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade platformio

    - name: Set artifact filename environment variable
      run: |
        echo "ARTIFACT_NAME=Glyph-${SHA_SHORT}.${BIN_EXT}" >> "$GITHUB_ENV"

    - name: Set artifact path environment variable
      run: |
        echo "ARTIFACT_PATH=${PIO_ENV}/${ARTIFACT_NAME}" >> "$GITHUB_ENV"

    - name: Build ${{ matrix.env }} env
      run: |
        pio run -e "$PIO_ENV"
        mkdir -p "$PIO_ENV"
        cp ".pio/build/${PIO_ENV}/firmware.${BIN_EXT}" "$ARTIFACT_PATH"

    - name: nuke
      run: |
        mv glyph_nuker $PIO_ENV/glyph_nuker
        cd $PIO_ENV
        ls *.uf2 | xargs ./glyph_nuker
        rm glyph_nuker

    - name: Publish ${{ matrix.env }} artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Glyph_FW
        path: ${{ env.PIO_ENV }}
    
