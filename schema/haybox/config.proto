  BTN_MB6 = 54;        // Menu Button 6
  BTN_MB7 = 55;        // Menu Button 7
  BTN_MB8 = 56;        // Menu Button 8
  BTN_MB9 = 57;        // Menu Button 9
  BTN_MB10 = 58;       // Menu Button 10
  BTN_MB11 = 59;       // Menu Button 11
