syntax = "proto3";
import "config.proto";
message PackageMode {
 string name = 1;
 repeated SocdPair socd_pairs = 2;
 repeated ButtonRemap button_remapping = 3;
 repeated Button activation_binding = 4;
 LayoutPlate layout_plate = 5;
 repeated CommunicationBackendId applicable_backends = 6;
 repeated OutputOption menu_button_icon = 7;
}
message PackageBody {
 uint32 version = 1;
 string name = 2;
 uint32 display_rank = 3;
 PackageMode row = 4;
 bytes native_body = 5;
 RgbConfig rgb = 6;
}
enum PackageOperation { PACKAGE_OPERATION_UNSPECIFIED = 0; PACKAGE_STATUS = 1; CREATE_PACKAGE = 15; QUERY_PACKAGE = 16; UPDATE_PACKAGE = 17; RENAME_PACKAGE = 18; REORDER_PACKAGE = 19; DELETE_PACKAGE = 20; }
message PackageEnvelope {
 uint32 protocol_version = 1;
 uint64 request_token = 2;
 PackageOperation operation = 3;
 uint64 expected_store_generation = 4;
 uint64 expected_config_generation = 13;
 uint32 expected_store_incarnation = 21;
 bytes package_body = 24;
 optional bytes expected_digest = 25;
 optional bytes expected_config_sha256 = 26;
 uint32 target_id = 27;
 uint32 expected_revision = 28;
 string replacement_name = 29;
 optional uint32 replacement_rank = 30;
}

enum PackageLogicalDisposition { LOGICAL_NONE = 0; PROVEN_ABORTED = 1; INCOMPLETE = 2; COMMITTED = 3; UNRESOLVED = 4; }
enum PackageStorageFloor { FLOOR_UNRESOLVED = 0; NO_MANAGED = 1; SUPPORTED = 2; UNSUPPORTED_FORMAT = 3; }
message PackageResponse {
 reserved 52 to 217;
 uint32 protocol_version = 1;
 uint64 request_token = 2;
 ProfileStoreStatus status = 3;
 uint64 store_generation = 4;
 uint32 profile_id = 5;
 uint64 profile_revision = 6;
 uint64 config_generation = 10;
 uint32 transaction_operation = 24;
 uint64 transaction_token_high_water = 31;
 uint32 store_incarnation = 38;
 uint32 capability_version = 218;
 PackageLogicalDisposition logical = 219;
 bool write_fenced = 220;
 PackageStorageFloor storage_floor = 221;
 uint32 supported_package_format = 222;
 uint32 supported_root_format = 223;
 uint32 supported_record_format = 224;
 uint32 supported_receipt_format = 225;
 uint32 package_schema_version = 226;
 uint32 max_create_request_bytes = 227;
 uint32 max_create_frame_bytes = 228;
 uint32 max_query_request_bytes = 229;
 uint32 max_response_bytes = 230;
 uint32 max_response_frame_bytes = 231;
 optional uint32 row_index = 232;
 uint32 rgb_index = 233;
 optional bytes semantic_digest = 234;
 optional bytes config_sha = 235;
 optional bytes record_sha = 236;
 uint32 max_query_frame_bytes = 237;
 uint32 capability_bits = 238;
 uint32 max_package_body_bytes = 239;
 uint32 record_publication_generation = 240;
}
