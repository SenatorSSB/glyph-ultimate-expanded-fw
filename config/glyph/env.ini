[glyph_base]
extends = arduino_pico_base
upload_protocol = cmsis-dap
build_flags =
    ${arduino_pico_base.build_flags}
    -I config/glyph/common/include
    -I config/glyph/${PIOENV}/include
    -D SSD1306_NO_SPLASH
build_src_filter =
    ${arduino_pico_base.build_src_filter}
    +<config/glyph/common/src>
    +<config/glyph/${PIOENV}>
lib_ignore =
    ${env.lib_ignore}
    https://github.com/JonnyHaystack/HayBox-proto
lib_deps =
    ${arduino_pico_base.lib_deps}
    https://github.com/GregTurbo/HayBox-proto#db4e2f6

[env:glyph_protoA]
extends = glyph_base

[env:glyph_mk6_Debug]
extends = glyph_base
build_unflags = 
    -O3
    -NDEBUG
build_flags =
    ${arduino_pico_base.build_flags}
    -I config/glyph/common/include
    -I config/glyph/glyph_mk6/include
    -D SSD1306_NO_SPLASH
    -Og
build_src_filter =
    ${arduino_pico_base.build_src_filter}
    +<config/glyph/common/src>
    +<config/glyph/$glyph_mk6>

# Temporary exact strict-hardening candidate instrumentation. STATUS reports
# both flags; removing/accepting it is a separate exact-source acceptance gate.
[env:glyph_mk6]
extends = glyph_base
build_flags =
    ${glyph_base.build_flags}
    -D GLYPH_STRICT_HARDENING_CANDIDATE=1
    -D GLYPH_RESOURCE_DIAGNOSTICS=1
    -Wl,--wrap=_sbrk

[env:glyph_mk6_senscope_playtest]
extends = glyph_base
build_flags =
    ${arduino_pico_base.build_flags}
    -I config/glyph/common/include
    -I config/glyph/glyph_mk6/include
    -D SSD1306_NO_SPLASH
    -D SENSCOPE_PROTOTYPE_ENABLE_MANUAL_SELECTION=1
build_src_filter =
    ${arduino_pico_base.build_src_filter}
    +<config/glyph/common/src>
    +<config/glyph/glyph_mk6>
